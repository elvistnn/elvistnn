@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#f0f4f8;min-height:100vh;color:#1a2332}
.app{display:flex;flex-direction:column;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;background:#0f2548}

.header{background:#1e4d8c;color:#fff;padding:0 1.25rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}

function defaultUsers(){
  const u={admin:{pass:'admin123',name:'Administrador',role:'admin'}};
  for(let i=1;i<=25;i++) u[`super${i}`]={pass:'123456',name:`Supervisor ${i}`,role:'user'};
  return u;
}
let USERS = {};
function saveUsers(){}

let state={
  currentUser:null,
  visits:[],
  view:'dashboard',
  calYear:new Date().getFullYear(),
  calMonth:new Date().getMonth(),
  selectedSchoolCode:null,
  selectedCalDay:null,
  editingKey:null,
  schoolSearch:'',
  regSearch:''
};
async function saveVisits(){
  await window.firebaseFunctions.set(
    window.firebaseFunctions.ref(window.db,'visits'),
    state.visits
  );
}


async function loadUserData(){
  const snapshot = await window.firebaseFunctions.get(
    window.firebaseFunctions.ref(window.db,'users')
  );

  if(snapshot.exists()){
    USERS = snapshot.val();
  }

  const current = Object.values(USERS).find(
    u => u.uid === state.currentUser
  );

  if(current){
    document.getElementById('headerUser').textContent = current.name;
    document.getElementById('headerRole').textContent =
      current.role === 'admin' ? 'Administrador' : 'Supervisor';
  }

  buildNav();
  renderView('dashboard');
}

async function loadVisits(){
  const snapshot = await window.firebaseFunctions.get(
    window.firebaseFunctions.ref(window.db,'visits')
  );

  if(snapshot.exists()){
    state.visits = Object.values(snapshot.val());
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

async function doLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;

  try{
    const userCredential =
      await window.firebaseFunctions.signInWithEmailAndPassword(
        window.auth,
        email,
        pass
      );

    const snapshot = await window.firebaseFunctions.get(
      window.firebaseFunctions.ref(window.db,'users')
    );

    if(snapshot.exists()){
      USERS = snapshot.val();
    }

    const uid = userCredential.user.uid;

    const userKey = Object.keys(USERS).find(
      key => USERS[key].uid === uid
    );

    state.currentUser = userKey;

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');

    await loadVisits();
    await loadUserData();

  }catch(error){
    const err=document.getElementById('loginError');
    err.style.display='block';
    setTimeout(()=>err.style.display='none',3000);
  }
}
async function doLogout(){
  await window.firebaseFunctions.signOut(window.auth);
  state.currentUser=null;
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function buildNav(){
  const isAdmin=USERS[state.currentUser].role==='admin';
  const tabs=isAdmin?
    [{id:'dashboard',label:'Painel'},{id:'visits',label:'Visitas'},{id:'calendar',label:'Calendário'},{id:'users',label:'Usuários'},{id:'report',label:'Relatório'}]:
    [{id:'dashboard',label:'Início'},{id:'calendar',label:'Meu Calendário'},{id:'history',label:'Histórico'}];
  document.getElementById('navBar').innerHTML=tabs.map(t=>`<button class="nav-btn${state.view===t.id?' active':''}" onclick="renderView('${t.id}')">${t.label}</button>`).join('');
}

function renderView(v){
  state.view=v;buildNav();
  const c=document.getElementById('mainContent');
  const isAdmin=USERS[state.currentUser].role==='admin';
  if(v==='dashboard') isAdmin?renderAdminDashboard(c):renderUserDashboard(c);
  else if(v==='visits') renderAdminVisits(c);
  else if(v==='calendar') renderCalendar(c);
  else if(v==='history') renderHistory(c);
  else if(v==='users') renderUsers(c);
  else if(v==='report') renderReport(c);
}

function myVisits(){return state.visits.filter(v=>v.user===state.currentUser)}
function visitsBySchool(user,code){return state.visits.filter(v=>v.user===user&&v.schoolCode===code).length}

/* ---- DASHBOARD USER ---- */
function renderUserDashboard(c){
  const mv=myVisits();
  const totalV=mv.length;
  const schoolsDone=new Set(mv.map(v=>v.schoolCode)).size;
  const milestones=SCHOOLS.filter(s=>visitsBySchool(state.currentUser,s.code)>=3).length;
  const milestoneAlert=milestones>0?`<div class="milestone-alert"><div class="ma-icon">&#127942;</div><div class="ma-text"><h3>${milestones} escola${milestones>1?'s':''} com 3+ visitas!</h3><p>Ótimo trabalho, continue supervisionando.</p></div></div>`:'';
  c.innerHTML=`${milestoneAlert}
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${totalV}</div><div class="stat-label">Total de visitas</div></div>
    <div class="stat-card"><div class="stat-num">${schoolsDone}</div><div class="stat-label">Escolas visitadas</div></div>
    <div class="stat-card"><div class="stat-num">${milestones}</div><div class="stat-label">Marcos 3 visitas</div></div>
  </div>
  <div class="card">
    <div class="card-title">Escolas com visitas registradas</div>
    ${SCHOOLS.filter(s=>visitsBySchool(state.currentUser,s.code)>0).map(s=>{
      const cnt=visitsBySchool(state.currentUser,s.code);
      const dots=Array.from({length:Math.max(cnt,3)},(_,i)=>`<div class="dot${i<cnt?(cnt>=3&&i===2?' milestone':' done'):''}"></div>`).join('');
      return`<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f0f4f8">
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div><div style="font-size:11px;color:#9ba8bb;margin-top:2px">Cód: ${s.code}</div></div>
        <div style="display:flex;gap:4px">${dots}</div>
        ${cnt>=3?`<span style="background:#fff3ee;color:#e85d26;border:1px solid #f0a080;border-radius:20px;font-size:10px;font-weight:600;padding:2px 8px">${cnt} visitas</span>`:`<span style="font-size:12px;color:#6b7a93">${cnt}x</span>`}
      </div>`;
    }).join('')||'<p style="color:#9ba8bb;font-size:14px">Nenhuma visita ainda. Use Meu Calendário para registrar.</p>'}
  </div>`;
}

/* ---- CALENDAR (user: register + view | admin: view all) ---- */
function renderCalendar(c){
  const isAdmin=USERS[state.currentUser].role==='admin';
  const relevant=isAdmin?state.visits:myVisits();
  const y=state.calYear,m=state.calMonth;
  const monthName=new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const visitsByDay={};
  relevant.filter(v=>v.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).forEach(v=>{
    const d=parseInt(v.date.split('-')[2]);
    if(!visitsByDay[d]) visitsByDay[d]=[];
    visitsByDay[d].push(v);
  });
  const WEEK=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="cal-day empty"></div>`;
  const today=new Date();
  for(let d=1;d<=days;d++){
    const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const vs=visitsByDay[d]||[];
    const isSelected=state.selectedCalDay===d;
    const chips=vs.slice(0,2).map(v=>{
      const cnt=visitsBySchool(v.user,v.schoolCode);
      return`<div class="cal-chip${cnt>=3?' milestone':''}">${isAdmin?v.userName.split(' ').slice(0,2).join(' '):v.schoolName.substring(0,16)}</div>`;
    }).join('')+(vs.length>2?`<div style="font-size:9px;color:#1e4d8c;padding:1px 2px">+${vs.length-2}</div>`:'');
    cells+=`<div class="cal-day${isToday?' today':''}${vs.length?' has-visits':''}${isSelected?' selected-day':''}" onclick="selectCalDay(${d})">
      <span class="cal-day-num">${d}</span>
      <div class="cal-visit-chips">${chips}</div>
    </div>`;
  }

  const todayStr=new Date().toISOString().split('T')[0];
  const selDateStr=state.selectedCalDay?`${y}-${String(m+1).padStart(2,'0')}-${String(state.selectedCalDay).padStart(2,'0')}`:null;
  const selVisits=selDateStr?(isAdmin?state.visits.filter(v=>v.date===selDateStr):myVisits().filter(v=>v.date===selDateStr)):[];

  const sidePanel=`<div class="side-panel">
    <div class="side-title">${state.selectedCalDay?new Date(selDateStr+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}):'Selecione um dia'}</div>
    ${!isAdmin&&state.selectedCalDay?`
    <div style="margin-bottom:12px">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="ifield" id="regSearch" placeholder="Buscar escola..." style="padding-left:36px" oninput="filterRegSearch()" value="${state.regSearch}" />
      </div>
      <div id="regSchoolList" style="max-height:200px;overflow-y:auto;border:1.5px solid #dde3ed;border-radius:12px;margin-bottom:10px"></div>
      <button class="btn-success" style="width:100%;font-size:13px;padding:10px" onclick="registerVisitFromCal()">Registrar visita</button>
    </div>`:''}
    ${selVisits.length>0?`<div style="border-top:1px solid #f0f4f8;padding-top:10px;margin-top:${!isAdmin&&state.selectedCalDay?'10px':'0'}">
      <div style="font-size:12px;font-weight:600;color:#6b7a93;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px">Visitas do dia (${selVisits.length})</div>
      ${selVisits.map(v=>`<div class="visit-item">
        <div class="visit-icon" style="font-size:14px">&#127eb;</div>
        <div class="visit-info">
          <div class="visit-school">${v.schoolName}</div>
          <div class="visit-date">${isAdmin?v.userName:''} ${visitsBySchool(v.user,v.schoolCode)>=3?'&#127942;':''}</div>
        </div>
        ${!isAdmin?`<button class="btn-danger" style="font-size:11px;padding:5px 9px" onclick="deleteVisit(${v.id})">&#215;</button>`:''}
      </div>`).join('')}
    </div>`:(state.selectedCalDay?`<p style="font-size:13px;color:#9ba8bb;text-align:center;padding:1rem 0">Nenhuma visita neste dia</p>`:'')}
  </div>`;

  c.innerHTML=`<div class="cal-layout">
    <div>
      <div class="card" style="margin-bottom:0">
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">&#8249;</button>
          <span class="cal-month">${monthName.charAt(0).toUpperCase()+monthName.slice(1)}</span>
          <button onclick="changeMonth(1)">&#8250;</button>
        </div>
        <div class="cal-grid">
          ${WEEK.map(w=>`<div class="cal-header">${w}</div>`).join('')}${cells}
        </div>
        ${!isAdmin?`<p style="font-size:12px;color:#9ba8bb;margin-top:12px;text-align:center">Clique num dia para selecionar e registrar uma visita</p>`:''}
      </div>
    </div>
    ${sidePanel}
  </div>`;

  if(!isAdmin&&state.selectedCalDay) renderRegSchoolList();
}

window.selectCalDay=function(d){
  state.selectedCalDay=state.selectedCalDay===d?null:d;
  state.selectedSchoolCode=null;
  state.regSearch='';
  renderView('calendar');
};

window.filterRegSearch=function(){
  state.regSearch=document.getElementById('regSearch').value;
  renderRegSchoolList();
};

function renderRegSchoolList(){
  const el=document.getElementById('regSchoolList');
  if(!el) return;
  const q=state.regSearch.toLowerCase();
  const filtered=SCHOOLS.filter(s=>s.name.toLowerCase().includes(q)||s.code.includes(q));
  el.innerHTML=filtered.slice(0,20).map(s=>{
    const cnt=visitsBySchool(state.currentUser,s.code);
    const sel=state.selectedSchoolCode===s.code;
    return`<div class="school-row${sel?' selected':''}" onclick="pickRegSchool('${s.code}')">
      <span class="s-code">${s.code}</span>
      <span class="s-name">${s.name}</span>
      ${cnt>=3?`<span class="s-badge">&#127942; ${cnt}</span>`:(cnt>0?`<span class="s-cnt">${cnt}x</span>`:'')}
    </div>`;
  }).join('')+(filtered.length>20?`<div style="padding:8px 14px;font-size:12px;color:#9ba8bb">+${filtered.length-20} resultados. Refine a busca.</div>`:'');
}

window.pickRegSchool=function(code){
  state.selectedSchoolCode=code;
  renderRegSchoolList();
};

window.registerVisitFromCal=function(){
  if(!state.selectedSchoolCode){showToast('Selecione uma escola na lista');return}
  if(!state.selectedCalDay){showToast('Selecione um dia no calendário');return}
  const y=state.calYear,m=state.calMonth,d=state.selectedCalDay;
  const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const school=SCHOOLS.find(s=>s.code===state.selectedSchoolCode);
  const dt=new Date(dateStr+'T12:00:00');
  const dup=state.visits.find(v=>v.user===state.currentUser&&v.schoolCode===school.code&&v.date===dateStr);
  if(dup){showToast('Visita já registrada nessa escola neste dia');return}
  state.visits.push({
    id:Date.now(),user:state.currentUser,userName:USERS[state.currentUser].name,
    schoolCode:school.code,schoolName:school.name,date:dateStr,
    dayName:dt.toLocaleDateString('pt-BR',{weekday:'long'})
  });
  saveVisits();
  const cnt=visitsBySchool(state.currentUser,school.code);
  if(cnt===3) showToast('Marco atingido! 3 visitas em '+school.name);
  else showToast('Visita registrada: '+school.name);
  state.selectedSchoolCode=null;
  state.regSearch='';
  renderView('calendar');
};

window.changeMonth=function(d){
  state.calMonth+=d;
  if(state.calMonth<0){state.calMonth=11;state.calYear--}
  if(state.calMonth>11){state.calMonth=0;state.calYear++}
  state.selectedCalDay=null;
  renderView('calendar');
};

/* ---- HISTORY ---- */
function renderHistory(c){
  const mv=myVisits().slice().reverse();
  const q=(state.schoolSearch||'').toLowerCase();
  const filtered=q?mv.filter(v=>v.schoolName.toLowerCase().includes(q)||v.schoolCode.includes(q)):mv;
  c.innerHTML=`<div class="card">
    <div class="card-title">Histórico de visitas</div>
    <div class="search-box" style="margin-bottom:12px">
      <span class="search-icon">&#128269;</span>
      <input type="text" class="ifield" id="histSearch" placeholder="Buscar escola..." style="padding-left:36px" oninput="filterHistory()" value="${state.schoolSearch||''}" />
    </div>
    ${filtered.length===0?'<p style="color:#9ba8bb;font-size:14px">Nenhuma visita encontrada</p>':
    filtered.map(v=>`<div class="visit-item">
      <div class="visit-icon" style="font-size:14px">&#127eb;</div>
      <div class="visit-info">
        <div class="visit-school">${v.schoolName}</div>
        <div class="visit-date">${new Date(v.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})} &bull; Cód: ${v.schoolCode}</div>
      </div>
      <button class="btn-danger" style="font-size:11px;padding:5px 9px" onclick="deleteVisit(${v.id})">&#215;</button>
    </div>`).join('')}
  </div>`;
}
window.filterHistory=function(){
  state.schoolSearch=document.getElementById('histSearch').value;
  renderHistory(document.getElementById('mainContent'));
};

function deleteVisit(id){
  state.visits=state.visits.filter(v=>v.id!==id);saveVisits();
  renderView(state.view);showToast('Visita removida');
}

/* ---- ADMIN DASHBOARD ---- */
function renderAdminDashboard(c){
  const total=state.visits.length;
  const users=new Set(state.visits.map(v=>v.user)).size;
  const schools=new Set(state.visits.map(v=>v.schoolCode)).size;
  const today=new Date().toISOString().split('T')[0];
  const todayCount=state.visits.filter(v=>v.date===today).length;
  c.innerHTML=`
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total de visitas</div></div>
    <div class="stat-card"><div class="stat-num">${users}</div><div class="stat-label">Supervisores ativos</div></div>
    <div class="stat-card"><div class="stat-num">${schools}</div><div class="stat-label">Escolas visitadas</div></div>
    <div class="stat-card"><div class="stat-num">${todayCount}</div><div class="stat-label">Visitas hoje</div></div>
  </div>
  <div class="card">
    <div class="card-title">Top escolas mais visitadas</div>
    ${SCHOOLS.map(s=>({s,cnt:state.visits.filter(v=>v.schoolCode===s.code).length})).filter(x=>x.cnt>0).sort((a,b)=>b.cnt-a.cnt).slice(0,10).map(({s,cnt})=>{
      const pct=total>0?Math.round(cnt/total*100):0;
      return`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${s.name}</span>
          <span style="color:#6b7a93;flex-shrink:0">${cnt} visita${cnt!==1?'s':''}</span>
        </div>
        <div style="background:#f0f4f8;border-radius:4px;height:6px"><div style="background:#1e4d8c;height:6px;border-radius:4px;width:${pct}%"></div></div>
      </div>`;
    }).join('')||'<p style="color:#9ba8bb;font-size:14px">Nenhuma visita ainda</p>'}
  </div>`;
}

/* ---- ADMIN VISITS ---- */
function renderAdminVisits(c){
  const last=state.visits.slice().reverse().slice(0,40);
  c.innerHTML=`<div class="card">
    <div class="card-title">Últimas visitas (${state.visits.length} total)</div>
    ${last.length===0?'<p style="color:#9ba8bb;font-size:14px">Nenhuma visita ainda</p>':
    last.map(v=>`<div class="visit-item">
      <div class="visit-icon" style="font-size:14px">&#127eb;</div>
      <div class="visit-info">
        <div class="visit-school">${v.schoolName}</div>
        <div class="visit-date">${v.userName} &bull; ${new Date(v.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}</div>
      </div>
      <button class="btn-danger" style="font-size:11px;padding:5px 9px" onclick="deleteVisit(${v.id})">&#215;</button>
    </div>`).join('')}
  </div>`;
}

/* ---- USERS ---- */
function renderUsers(c){
  c.innerHTML=`<div class="card">
    <div class="card-title">Usuários do sistema</div>
    <div style="overflow-x:auto"><table class="user-table">
      <thead><tr><th>Login</th><th>Nome</th><th>Perfil</th><th>Visitas</th><th style="text-align:right">Ações</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table></div>
  </div>`;
  renderUsersBody();
}
function renderUsersBody(){
  const body=document.getElementById('usersBody');
  if(!body) return;
  body.innerHTML=Object.entries(USERS).map(([key,d])=>{
    const vc=state.visits.filter(v=>v.user===key).length;
    const isAdm=d.role==='admin';
    return`<tr>
      <td style="font-family:monospace;font-size:12px;color:#1e4d8c">${key}</td>
      <td style="font-weight:500">${d.name}</td>
      <td><span class="tag tag-${d.role}">${isAdm?'Admin':'Supervisor'}</span></td>
      <td><span class="tag tag-visits">${vc}</span></td>
      <td style="text-align:right">${!isAdm?`<button class="btn-edit" onclick="openEditModal('${key}')">Editar</button>`:'<span style="color:#ccc;font-size:12px">—</span>'}</td>
    </tr>`;
  }).join('');
}

window.openEditModal=function(key){
  state.editingKey=key;
  const u=USERS[key];
  document.getElementById('modalTitle').textContent='Editar: '+u.name;
  document.getElementById('modalName').value=u.name;
  document.getElementById('modalLogin').value=key;
  document.getElementById('modalPass').value='';
  document.getElementById('editModal').classList.remove('hidden');
};
window.closeModal=function(){document.getElementById('editModal').classList.add('hidden');state.editingKey=null;};
window.saveUserEdit=function(){
  const oldKey=state.editingKey;if(!oldKey) return;
  const newName=document.getElementById('modalName').value.trim();
  const newLogin=document.getElementById('modalLogin').value.trim();
  const newPass=document.getElementById('modalPass').value.trim();
  if(!newName){showToast('Nome não pode ser vazio');return}
  if(!newLogin){showToast('Login não pode ser vazio');return}
  if(!/^[a-zA-Z0-9_]+$/.test(newLogin)){showToast('Login: use apenas letras, números e _');return}
  if(newLogin!==oldKey&&USERS[newLogin]){showToast('Login já em uso');return}
  const userData={...USERS[oldKey],name:newName};
  if(newPass) userData.pass=newPass;
  if(newLogin!==oldKey){
    delete USERS[oldKey];USERS[newLogin]=userData;
    state.visits=state.visits.map(v=>v.user===oldKey?{...v,user:newLogin,userName:newName}:v);
    if(state.currentUser===oldKey) state.currentUser=newLogin;
  } else {
    USERS[oldKey]=userData;
    state.visits=state.visits.map(v=>v.user===oldKey?{...v,userName:newName}:v);
  }
  saveVisits();
  window.firebaseFunctions.set(
    window.firebaseFunctions.ref(window.db,'users'),
    USERS
  );
  closeModal();
  showToast('Usuário atualizado!');
  renderUsersBody();
};

/* ---- REPORT ---- */
function renderReport(c){
  c.innerHTML=`<div class="card">
    <div class="card-title">Relatório de visitas</div>
    <p style="font-size:14px;color:#6b7a93;margin-bottom:1.5rem">Relatório completo em Excel com todas as visitas registradas.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:1.5rem">
      <div class="stat-card" style="flex:1;min-width:120px"><div class="stat-num">${state.visits.length}</div><div class="stat-label">Registros</div></div>
      <div class="stat-card" style="flex:1;min-width:120px"><div class="stat-num">${new Set(state.visits.map(v=>v.user)).size}</div><div class="stat-label">Supervisores</div></div>
      <div class="stat-card" style="flex:1;min-width:120px"><div class="stat-num">${new Set(state.visits.map(v=>v.schoolCode)).size}</div><div class="stat-label">Escolas</div></div>
    </div>
    <button class="btn-download" onclick="downloadExcel()">&#11015; Baixar relatório Excel</button>
  </div>`;
}

window.downloadExcel=function(){
  if(!window.XLSX){showToast('Aguarde a biblioteca carregar...');return}
  const schoolVisitCount={};
  state.visits.forEach(v=>{
    const key=v.user+'|'+v.schoolCode;
    schoolVisitCount[key]=(schoolVisitCount[key]||0)+1;
  });
  const data=[['Nome do Supervisor','Data da Visita','Dia da Semana','Código da Escola','Nome da Escola','Quantidade de Visitas na Escola']];
  state.visits.forEach(v=>{
    const dt=new Date(v.date+'T12:00:00');
    const key=v.user+'|'+v.schoolCode;
    data.push([v.userName,dt.toLocaleDateString('pt-BR'),v.dayName,v.schoolCode,v.schoolName,schoolVisitCount[key]]);
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=[{wch:26},{wch:16},{wch:18},{wch:14},{wch:46},{wch:28}];
  XLSX.utils.book_append_sheet(wb,ws,'Visitas');
  const sum=[['Código','Escola','Total de Visitas']];
  SCHOOLS.forEach(s=>sum.push([s.code,s.name,state.visits.filter(v=>v.schoolCode===s.code).length]));
  const ws2=XLSX.utils.aoa_to_sheet(sum);
  ws2['!cols']=[{wch:12},{wch:48},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws2,'Resumo por Escola');
  XLSX.writeFile(wb,`relatorio_visitas_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('Relatório exportado!');
};

window.deleteVisit=deleteVisit;
window.renderView=renderView;
window.doLogin=doLogin;
window.doLogout=doLogout;
</script>
